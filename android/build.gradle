// ============================================================================
// 《光影Play》(Prism Play) v2.0 - root Gradle file
//
// MIRROR OF the Capacitor 7.6.9 android-template, verified against
// node_modules/@capacitor/cli/assets/android-template.tar.gz, with our appId/namespace
// org.prismos.play and the extra version entries this app needs.
//
// DIFFERENCE FROM THE RAW TEMPLATE: no `com.google.gms:google-services` classpath entry.
// The MVP ships no third-party SDK (AGENTS.md de-platforming rule) and the generated
// app/build.gradle only applies that plugin when google-services.json exists - which it
// never will here. Adding it back would put an unused dependency in the build graph.
//
// Stage 4 note: `npx cap add android` wrote its own copy of this file; ours is the one
// that survives, because `cap sync`/`cap update` never rewrite root build.gradle.
// Build-readiness is proven by the GitHub Actions job, not by this machine (no JDK/SDK here).
// ============================================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

// `variables.gradle` is generated by `npx cap add android`; the fallback keeps this file
// self-sufficient if a checkout ever loses it.
if (file('variables.gradle').exists()) {
    apply from: 'variables.gradle'
} else {
    logger.warn('[prism] variables.gradle absent - using hand-authored SDK versions')
    ext {
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        androidxActivityVersion = '1.9.2'
        androidxAppCompatVersion = '1.7.0'
        androidxCoordinatorLayoutVersion = '1.2.0'
        androidxCoreVersion = '1.15.0'
        androidxFragmentVersion = '1.8.4'
        coreSplashScreenVersion = '1.0.1'
        androidxWebkitVersion = '1.12.1'
        junitVersion = '4.13.2'
        androidxJunitVersion = '1.2.1'
        androidxEspressoCoreVersion = '3.6.1'
        cordovaAndroidVersion = '10.1.1'
    }
}

ext {
    // Domain 1 (SPEC 6.1) credential store. 1.1.0 is the last release of this artifact: the
    // whole AndroidX Security library was deprecated in favour of using AndroidKeyStore
    // directly. Kept because the Stage 3 brief mandates MasterKey + EncryptedSharedPreferences;
    // see SecureCredentialStore for the containment plan.
    androidxSecurityCryptoVersion = '1.1.0'
    // Media notification style + ContextCompat.registerReceiver + ServiceCompat.startForeground
    // all live in androidx.core:core, so no androidx.media dependency is introduced.
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
