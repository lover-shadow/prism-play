// ============================================================================
// 《光影Play》(Prism Play) v2.0 - app module (Stage 4, standard layout)
//
// Same shape as the Capacitor 7.6.9 template app/build.gradle, plus:
//   * namespace/applicationId org.prismos.play (capacitor.config.ts)
//   * OTA version keys: versionCode 200 / versionName 2.0.0 - edge/src/core/semver.ts compares
//     the string the client sends to /api/version, so it must stay semver-shaped
//   * androidx.security:security-crypto (Domain 1 credential store)
//   * androidx.core (media notification, receiver export flags, FGS typing)
//
// Stage 4 change: the sourceSets redirection is GONE. Stage 3 kept the native layer at
// android/src/main while no scaffold existed; `npx cap add android` has since produced the
// standard layout, so the sources now live where Gradle and Android Studio expect them and
// no path gymnastics remain.
//
// `npx cap sync android` rewrites capacitor.build.gradle and capacitor.settings.gradle only;
// this file is written by `cap add` alone, so a sync will not clobber the lines above.
// ============================================================================

apply plugin: 'com.android.application'

android {
    namespace "org.prismos.play"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "org.prismos.play"
        minSdkVersion rootProject.ext.minSdkVersion
        // targetSdk 35 is what makes the Android 14 foreground-service type rule and the
        // API 33 POST_NOTIFICATIONS prompt apply to us; both are handled in PlaybackService
        // and PrismNativePlugin, and both are device-checklist items, not assumed behaviour.
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 200
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.0"
    // [re-apply after cap add] Domain 1 keystore-backed credential store; see root file for the
    // deprecation note that explains why this artifact is still pinned at 1.1.0.
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Generated by `npx cap sync android`: it wires the npm Capacitor plugins (app, preferences,
// filesystem, screen-orientation, status-bar, community sqlite) into the build. Tolerated when
// absent so this module still configures in a review-only checkout.
File capacitorBuildGradle = new File(projectDir, 'capacitor.build.gradle')
if (capacitorBuildGradle.exists()) {
    apply from: capacitorBuildGradle
} else {
    logger.warn('[prism] app/capacitor.build.gradle missing - run `npx cap sync android`')
}
