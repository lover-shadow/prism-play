            schema:
              type: object
              required: [requestId, confirmed, document]
              properties:
                requestId: {type: string, pattern: '^[A-Za-z0-9_-]{8,100}$'}
                confirmed: {type: boolean, enum: [true]}
                document: {$ref: '#/components/schemas/AnnouncementDocument'}
      responses:
        '200': {description: 已写入，传播可能延迟}
        '400': {description: 参数错误}
        '401': {description: 无有效后台会话}
        '403': {description: Origin或CSRF拒绝}
        '409': {description: 请求已认领，请读取配置核对}
        '503': {description: 未确认写入成功，请先读回对账}

