openapi: 3.0.3
info:
  title: 光影Play (Prism Play) Cloudflare Edge API
  description: |
    《光影Play》（Prism Play）客户端与 Cloudflare Serverless 边缘云脑（Workers + Cron + D1 + KV + R2）标准通信契约。
    遵循三条硬原则：
    1. 零外部站源名与零真实上游地址暴露——客户端只拿同源代理地址与不透明句柄；
    2. 动态“大视界”拓扑下发，私密频道在「授权 + 当次开启」双重条件未满足时物理不可见；
    3. 预制卡密条件原子核销 + 非对称签名凭证（Ed25519），客户端仅持公钥。
    本文件为接口机读正本；文字说明见 `API-SPEC.md`，施工总契约见 `docs/04-spec/SPEC-v2.0.md`。
    2026-10-04 R26执行事实同步：局部实现已存在，旧1040通过仅首批report，新全量/浏览器/原生/生产未验，不代表R26全完成。
    publicSearch是内部manifest描述（schema=1/count/key/bytes/sha256，library/search/{sha256}.json，最多16 MiB），不新增公网路由或响应字段。
    内部对象schema=1/revision/entries(item/aliases/pinyin/tags)与workFacts同代，须校验hash/bytes/count/频道总数并复核返回事实。
    现代workFacts代缺失或损坏投影503，不回旧D1；仅真实无workFacts旧代可兼容。上线须同代blobs先校验上传、manifest pointer后切、Worker配套，禁止单独部署搜索Worker。
  version: 2.0.0
  contact:
    name: PrismOS Architecture Team
    url: https://play.prismos.org

servers:
  - url: https://play.prismos.org
    description: 生产环境 Cloudflare 全球边缘网关
  - url: http://localhost:8787
    description: 本地 Wrangler 开发模拟环境

tags:
  - name: 频道与内容
  - name: 商业化
  - name: 私密探索
  - name: 分享与下载
  - name: 系统
  - name: 搜索与同步
  - name: 运营后台

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-prism_admin_session
      description: 后台独立的12小时服务端会话；不接受App JWT。写操作还须精确Origin及X-CSRF-Token，所有响应no-store且不反射CORS。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        卡密核销后由边缘以 Ed25519(EdDSA) 私钥签发；`kid` 指定密钥版本。
        客户端仅内置公钥用于离线验签，**绝不下发签名私钥**。
        最长 14 天离线仅代表「授权可离线验证」，不代表可离线播放任意在线剧集。
    PrivateSession:
      type: apiKey
      in: header
      name: X-Private-Session
      description: |
        当次私密探索的短时凭据，由 `POST /api/private-sessions` 在已具备有效 B/Y/S 授权时签发；使用限于本次应用进程会话，不可跨重启恢复。
        该凭据**不落盘**：客户端仅驻内存，冷启动/完全退出即失效；缺失时所有私密数据一律不返回。

  schemas:
    AdminError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, CONFLICT, RATE_LIMITED, UNAVAILABLE, NOT_FOUND, METHOD_NOT_ALLOWED]
    AdminSessionResponse:
      type: object
      required: [csrf, expiresAt]
      properties:
        csrf:
          type: string
        expiresAt:
          type: integer
          description: Unix秒绝对到期时间
    AdminGenerateRequest:
      allOf:
        - $ref: '#/components/schemas/AdminCouponMutation'
        - type: object
          required: [requestId, tier, count]
    AdminRevokeRequest:
      allOf:
        - $ref: '#/components/schemas/AdminCouponMutation'
        - type: object
          required: [requestId, reason]
    AdminCouponMutation:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 100
        note:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 200
        tier:
          type: string
          enum: [Q, B, Y, S]
        count:
          type: integer
          minimum: 1
          maximum: 100
    ChannelItem:
      type: object
      required: [id, name, order, categories]
      properties:
        id:
          type: string
          enum: [drama, movie, anime, documentary, private]
          description: 频道唯一标识；仅 private 允许 ADVANCED 权限映射
          example: drama
        name:
          type: string
          description: 客户端固定公开导航标签：drama=精彩短剧、movie=电影仓库、documentary=人文纪录、anime=动漫；首页是本地视图，不作为ChannelItem下发
          example: 精彩短剧
        order:
          type: integer
          example: 1
        requiresTier:
          type: array
          description: |
            访问该频道所需档位；未满足时边缘网关直接物理剥离该节点。
            空数组表示全员可见；`private` 频道为 ["B","Y","S"]（Q/A 不具备探索资格）。
            映射规则：`channels.requires_tier='0'` → []；`'ADVANCED'` → [B,Y,S]，另须当次会话。
          items:
            type: string
            enum: [B, Y, S]
          example: ["B", "Y", "S"]
        categories:
          type: array
          items:
            type: string
          example: ["最新上线", "都市", "战神", "逆袭", "甜宠", "古装", "悬疑"]

    ContentItem:
      type: object
      description: 剧目卡片。`isPrivate` 由服务端依据内容目录判定，客户端传入的任何私密标志一律忽略。
      required: [id, channelId, title, category, isPrivate]
      properties:
        id:
          type: string
          description: 稳定 content_id（即分享短链中的 drama_id）
          example: d_8f31c2
        channelId:
          type: string
          example: drama
        title:
          type: string
          example: 剧名示例
        category:
          type: string
          example: 逆袭
        coverUrl:
          type: string
          description: 封面代理 URL；公开资源可缓存，个人探索资源逐次双重鉴权并 no-store
          example: https://play.prismos.org/proxy/img/d_8f31c2
        synopsis:
          type: string
          maxLength: 240
          description: 可选的清洗后真实摘要，最多240个Unicode code points；无摘要时省略
        tags:
          type: array
          maxItems: 6
          uniqueItems: true
          description: 可选的可信受控题材/风格展示标签；不得用搜索词、标题或制作类型推断
          items:
            type: string
            minLength: 1
            maxLength: 12
        releaseYear:
          type: integer
          minimum: 1000
          maximum: 9999
          description: 可选的来源明确年份；不得以发布日期、上架时间或采集时间推导
        region:
          type: string
          maxLength: 64
          description: 可选的来源明确地区
        language:
          type: string
          maxLength: 64
          description: 可选的来源明确语言
        episodeCount:
          type: integer
          example: 68
        releaseStatus:
          type: string
          enum: [finished, ongoing]
          description: 仅在上游有明确完结或连载证据时出现；缺省未知，不按集数猜测
        lastSyncedEpisode:
          type: integer
          minimum: 0
          maximum: 5000
          description: 最近完整成功同步的集数，必须与对应事实清单长度一致
        lastSyncedAt:
          type: integer
          minimum: 0
          description: 最近完整成功同步时间（Unix秒），与lastSyncedEpisode成对出现
        isPrivate:
          type: boolean
          example: false
        enabled:
          type: boolean
          description: 在线复核后的当前可见状态；入库默认 false，下架/授权失效不应作为可见卡返回
          example: true
        coverVersion:
          type: string
          description: 对应 content_items.cover_version；封面修改时变化，客户端据此更新文件缓存。没有封面时省略
        shareable:
          type: boolean
          description: 经单独确认可分享才为 true；入库默认 false，私密恒 false
          example: true
        isAi:
          type: boolean
          description: AI 短剧/漫剧形式标记；由云端批次任务标定（CLOUD-SYNC-JIT-PIPELINE-SPEC §3.3）。缺省即 false
          example: false
        isHot:
          type: boolean
          description: 全网热门标记：HotScore 排名前 15% 置 1（SPEC §3.2）。缺省即 false
          example: true
        firstPublishedAt:
          type: integer
          description: 首次发布秒级时间戳；目录分片携带，供端侧【实时新剧榜】本地排序（SPEC-CLOUD-REFACTOR v2 §3.1）。不进 UI 文案
          example: 1790000000
        hitsTotal:
          type: integer
          description: 上游累计热度值；目录分片携带，供端侧【总热播榜】本地排序（SPEC-CLOUD-REFACTOR v2 §3.1）。不进 UI 文案
          example: 9867

    EpisodeItem:
      type: object
      required: [episodeId, episodeNumber]
      properties:
        episodeId:
          type: integer
          description: 分集内部 ID，用于换取播放地址
          example: 10231
        episodeNumber:
          type: integer
          example: 1
        title:
          type: string
        durationSeconds:
          type: integer
          example: 132

    TitleDetail:
      type: object
      required: [item, episodes]
      properties:
        item:
          $ref: "#/components/schemas/ContentItem"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeItem"

    EpisodeLine:
      type: object
      description: 一条可切换播放线路（SPEC-CLOUD-REFACTOR v2 §3.2）。真实上游播放地址只存在于剧集清单，不进目录分片；providerId 为抽象代号，严禁品牌名（AGENTS.md §二.1）。
      required: [providerId]
      anyOf:
        - required: [mediaUrl]
        - required: [native]
          properties:
            providerId:
              enum: [provider_s1]
      properties:
        providerId:
          type: string
          example: provider_m1
        mediaUrl:
          type: string
          description: 普通线路的上游直连地址；存在 native 描述子时该地址不得直接交给 Web 播放器或投屏设备
        native:
          type: object
          additionalProperties: false
          description: 仅 provider_s1 可携带的非密钥原生解析身份。密钥在原生运行时获取，不进入清单或缓存；Web 不支持该线路。
          required: [kind, videoId]
          properties:
            kind:
              type: string
              enum: [s1-cenc]
            videoId:
              type: string
              pattern: '^[0-9]{1,32}$'

    TitleEpisodeEntry:
      type: object
      required: [episodeNumber, lines]
      properties:
        episodeNumber:
          type: integer
          example: 1
        title:
          type: string
        durationSeconds:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeLine"

    TitleAssetResponse:
      type: object
      description: 剧集清单（R2 `titles/{workId}.json` 资产经路由返回）。向后兼容超集：旧端读 item+episodes，新端读 episodes[].lines 直连播放。
      required: [workId, title, channelId, isPrivate, episodes, generatedAt, item]
      properties:
        workId:
          type: string
          example: d_8f31c2
        title:
          type: string
        channelId:
          type: string
          example: drama
        isPrivate:
          type: boolean
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/TitleEpisodeEntry"
        generatedAt:
          type: integer
        item:
          $ref: "#/components/schemas/ContentItem"

    PlaybackInfo:
      type: object
      description: 播放解析结果。只返回同源代理地址，**严禁**返回真实上游地址。
      required: [episodeId, url]
      properties:
        episodeId:
          type: integer
          example: 10231
        url:
          type: string
          description: 同源代理播放地址
          example: https://play.prismos.org/proxy/media/e_10231
        mimeType:
          type: string
          example: application/vnd.apple.mpegurl
        durationSeconds:
          type: integer
          example: 132
        expiresInSeconds:
          type: integer
          description: 代理地址有效期，避免长期可复制的直链
          example: 7200

    SourceProvider:
      type: object
      required: [id, name, channelId, apiBase, priority, latencyMs, healthy]
      properties:
        id:
          type: string
          description: 去平台化抽象源编号，严禁暴露上游真实品牌名
          example: provider_s1
        name:
          type: string
          example: 光影极速专线A
        channelId:
          type: string
          example: drama
        apiBase:
          type: string
          description: "同源受控代理地址基准（`play.prismos.org/proxy/media/{handle}`），不是真实上游域名；代理仅放行白名单目标并需鉴权"
          example: https://play.prismos.org/proxy/media/provider_s1
        priority:
          type: integer
          example: 1
        latencyMs:
          type: integer
          description: Cloudflare Scheduled Cron 最近一次健康探针实测延迟（毫秒）
          example: 68
        healthy:
          type: boolean
          example: true

    RedeemRequest:
      type: object
      required: [code, deviceId, platform]
      properties:
        code:
          type: string
          pattern: "^GY-(?:Q|A|B|Y|S)[A-Z0-9]{3,4}-[A-Z0-9]{4}-[A-Z0-9]{4}$"
          description: |
            历史卡密实例 GY-Q90D-A7F2-8899 的第二段为 4 字符；兼容旧批次可为 5 字符。档位以第二段首字符与服务端记录核验，不仅凭客户端格式授予权限：`Q` 季度畅享（初期公开主推，90天，不含个人探索）、
            `A` 历史普通兼容、`B` 高级全源、`Y` 年度尊享、`S` 内部赠予（不对外售卖）。
            仅 B/Y/S 具备个人探索资格。
          example: GY-Q90D-A7F2-8899
        deviceId:
          type: string
          pattern: "^GY-[A-Z0-9]{8}$"
          example: GY-800DF614
          description: 客户端持久化的随机安装标识；可被重装或恶意客户端伪造，不能当作不可变硬件身份
        platform:
          type: string
          enum: [android]
          example: android
        appVersion:
          type: string
          example: 2.0.0
        inviteRef:
          type: string
          pattern: "^GY-[A-Z0-9]{8}$"
          description: 用户显式输入的邀请码；网页 ref 无法保证跨 APK 安装，首次成功兑换且非自邀才唯一结算；无可靠归因时不结算
          example: GY-1024ABCD

    RedeemSuccessResponse:
      type: object
      required: [success, tier, tierName, expiresAt, token, message]
      properties:
        success:
          type: boolean
          example: true
        tier:
          type: string
          enum: ["Q", "A", "B", "Y", "S"]
          example: Q
        tierName:
          type: string
          example: 季度畅享卡
        expiresAt:
          type: integer
          description: Unix 秒级到期时间戳（-1 表示永久有效，仅 S 档）
          example: 1823456789
        token:
          type: string
          description: Ed25519 签名的 JWT；客户端用内置公钥离线验签
          example: eyJhbGciOiJFZERTQSIsImtpZCI6InAyMDI2In0...
        message:
          type: string
          example: 激活成功（有效期至 2027-03-30）

    PrivateSessionRequest:
      type: object
      required: [acknowledged]
      properties:
        acknowledged:
          type: boolean
          description: 必须为 true，表示用户已阅读并接受成人内容免责提示；为 false 时返回 400
          example: true

    PrivateSessionResponse:
      type: object
      required: [sessionToken, expiresInSeconds]
      properties:
        sessionToken:
          type: string
          description: 短时凭据，随请求头 `X-Private-Session` 使用；冷启动即失效
        expiresInSeconds:
          type: integer
          example: 7200

    DevicePingResponse:
      type: object
      required: [tier, expiresAt, token]
      properties:
        tier:
          type: string
          description: 当前档位；'0' 表示未激活/试用
          enum: ["0", "Q", "A", "B", "Y", "S"]
          example: Q
        expiresAt:
          type: integer
          example: 1823456789
        token:
          type: string
          description: 本次在线校验后重新签发的 Ed25519 JWT；若授权已撤销则返回 401，不签新凭证
        message:
          type: string

    UserSyncHistoryInput:
      type: object
      required: [contentId, episodeNumber, positionSeconds, durationSeconds]
      properties:
        contentId:
          type: string
          example: drama_modu_90567
        episodeNumber:
          type: integer
          minimum: 1
          example: 12
        positionSeconds:
          type: number
          minimum: 0
          example: 145.5
        durationSeconds:
          type: number
          minimum: 0
          example: 300

    UserSyncPreferences:
      type: object
      required: [genres, totalPlays]
      properties:
        genres:
          type: object
          description: 21 个双字题材的偏好得分向量；由客户端本地计算，服务端只存储与回放，不解释其值
          additionalProperties:
            type: number
            minimum: 0
          example: { "战神": 24.5, "逆袭": 18.0 }
        totalPlays:
          type: integer
          minimum: 0
          example: 48

    UserSyncRequest:
      type: object
      description: 仅既有公开断点与画像；不新增local_following收藏或prism.watch_seconds_total/prism.watch_seconds_last_nudge累计标量云同步字段。私密不落盘不上报，private/unknown观看时长零计。
      required: [history, preferences]
      properties:
        history:
          nullable: true
          description: 当前退出的这单部剧集断点；仅程序退出且无播放时可为 null
          allOf:
            - $ref: "#/components/schemas/UserSyncHistoryInput"
        preferences:
          $ref: "#/components/schemas/UserSyncPreferences"

    UserSyncAcceptedResponse:
      type: object
      required: [success, syncedAt]
      properties:
        success:
          type: boolean
          enum: [true]
        syncedAt:
          type: integer
          example: 1790945000

    SyncHistoryRow:
      type: object
      required: [contentId, episodeNumber, positionSeconds, durationSeconds, updatedAt]
      properties:
        contentId:
          type: string
        episodeNumber:
          type: integer
        positionSeconds:
          type: number
        durationSeconds:
          type: number
        updatedAt:
          type: integer

    UserSyncStateResponse:
      type: object
      required: [success, history, preferences]
      properties:
        success:
          type: boolean
          enum: [true]
        history:
          type: array
          maxItems: 50
          description: 按 updated_at 倒序的最近断点；未核销卡密时为空数组
          items:
            $ref: "#/components/schemas/SyncHistoryRow"
        preferences:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSyncPreferences"
          example: { "genres": { "战神": 24.5 }, "totalPlays": 48, "updatedAt": 1790945000 }

    SearchSuggestion:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
        type:
          type: string
          enum: [title, alias, pinyin, category, correction]
        contentId:
          type: string
          description: 仅作品类联想返回；公共目录有效 ID，不能包含私密或已撤片内容
    SearchResult:
      type: object
      required: [item, matchType]
      properties:
        item:
          $ref: '#/components/schemas/ContentItem'
        matchType:
          type: string
          enum: [exact, alias, pinyin, fuzzy, related]
    CatalogChange:
      oneOf:
        - type: object
          required: [revision, contentId, operation, item]
          properties:
            revision: { type: integer, format: int64 }
            contentId: { type: string }
            operation: { type: string, enum: [upsert] }
            item: { $ref: '#/components/schemas/ContentItem' }
          additionalProperties: false
        - type: object
          required: [revision, contentId, operation]
          properties:
            revision: { type: integer, format: int64 }
            contentId: { type: string }
            operation: { type: string, enum: [delete] }
          additionalProperties: false
      description: upsert 必须有当前可公开 item；delete 仅 ID 与版本，不得返回被撤内容元数据


    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          enum:
            - COUPON_NOT_FOUND
            - COUPON_REVOKED
            - COUPON_DEVICE_LIMIT_EXCEEDED
            - COUPON_INVALID_FORMAT
            - DEVICE_ID_INVALID
            - RATE_LIMITED
            - PRIVATE_SESSION_REQUIRED
            - TIER_INSUFFICIENT
            - NOT_FOUND
            - SERVICE_UNAVAILABLE
            - PLATFORM_UNSUPPORTED
            - CREDENTIAL_EXPIRED
            - VALIDATION_ERROR
            - PROXY_SIGNATURE_INVALID
            - CATALOG_REVISION_CONFLICT
            - CATALOG_CURSOR_EXPIRED
          description: 闭集机器可判别错误码
          example: COUPON_DEVICE_LIMIT_EXCEEDED
        message:
          type: string
          example: 该卡密绑定的共享设备已达上限（最多允许 10 台）

    MonetizationTier:
      type: object
      required: [tier, name, durationDays, priceYuan]
      properties:
        tier:
          type: string
          enum: ["Q", "A", "B", "Y", "S"]
          example: Q
        name:
          type: string
          example: 季度畅享卡
        durationDays:
          type: integer
          example: 90
        priceYuan:
          type: number
          example: 9.9
        desc:
          type: string
          example: 90 天免打扰纯净畅看

    NudgePolicy:
      type: object
      required: [freeTrialSeconds, stage1IntervalSeconds, stage2IntervalSeconds, stage3IntervalSeconds, stage1UntilSeconds, stage2UntilSeconds, dialogTitle, dialogBody]
      properties:
        stage1UntilSeconds:
          type: integer
          minimum: 1
          description: 累计播放不足此值使用第一阶段间隔，必须大于 freeTrialSeconds
          example: 108000
        stage2UntilSeconds:
          type: integer
          minimum: 1
          description: 累计播放不足此值使用第二阶段间隔，必须大于 stage1UntilSeconds
          example: 180000
        freeTrialSeconds:
          type: integer
          minimum: 0
          example: 54000
          description: 初始免打扰时长（例 15 小时；不按日历或集数折算）
        stage1IntervalSeconds:
          type: integer
          minimum: 1
          example: 3600
        stage2IntervalSeconds:
          type: integer
          minimum: 1
          example: 2700
        stage3IntervalSeconds:
          type: integer
          minimum: 1
          example: 1800
        dialogTitle:
          type: string
          example: 老板，看剧辛苦，借一步说话
        dialogBody:
          type: string
          example: 一个人维护全网多源与边缘服务器，不接广告不偷扣费。如果看爽了，赏小弟一听可乐钱。

    MonetizationConfig:
      type: object
      description: 商业价格、档位与提醒策略仍100%云端。作者contact/reward二维码可由host静态注入旧已确认本地public/images/author-contact.jpg及author-reward.jpg，不新增云QR字段；旧reward历史权益不构成当前购买/授权承诺，须附免责声明。下载文件不等于保存手机图库。
      required: [activeTiers, nudgePolicy]
      properties:
        activeTiers:
          type: array
          items:
            $ref: '#/components/schemas/MonetizationTier'
        nudgePolicy:
          $ref: '#/components/schemas/NudgePolicy'
        privateAccessTiers:
          type: array
          description: 云端动态下发具备个人探索准入资格的档位集合，供客户端设置中心判断是否露出模式开关（解决露出判据与私密频道隐形互锁难题）
          items:
            type: string
            enum: ["B", "Y", "S"]
          example: ["B", "Y", "S"]

    VersionResponse:
      type: object
      required: [android]
      properties:
        service:
          type: object
          description: Cloudflare 实际服务部署标识，与官网 APK 公告版本不同
          required: [buildId, deployedAt]
          properties:
            buildId:
              type: string
            deployedAt:
              type: string
        android:
          type: object
          required: [versionCode, versionName, downloadUrl]
          properties:
            versionCode:
              type: integer
              example: 200
            versionName:
              type: string
              example: v2.0.0
            changelog:
              type: string
              example: "1. 大视界频道架构升级\n2. 琥珀金日夜双模与四模海报\n3. 手势播放与定时关闭"
            downloadUrl:
              type: string
              example: https://play.prismos.org/dl/latest/android
            artifact:
              type: object
              additionalProperties: false
              required: [key, bytes, sha256]
              description: 下载入口必需的已核验不可变APK；缺失时版本可读但下载503
              properties:
                key:
                  type: string
                  pattern: '^releases/android/[1-9][0-9]*/[a-f0-9]{64}\.apk$'
                bytes:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
            minVersionCode:
              type: integer
              description: 预留升级策略字段；当前最小闭环仅提供可选提醒，不启用强制门禁
              example: 100
            force:
              type: boolean
              example: false

    AnnouncementItem:
      type: object
      required: [id, revision, title, body, startsAt, endsAt]
      properties:
        id:
          type: string
          example: anno_20261008
        revision:
          type: integer
          example: 1
        title:
          type: string
          example: 欢迎使用光影Play全新版本
        body:
          type: string
          example: 启动速度与线路调度已全面优化。
        startsAt:
          type: integer
          example: 1791470000
        endsAt:
          type: integer
          example: 1792000000

    AnnouncementDocument:
      type: object
      required: [schema, revision, items]
      description: 全量纯文本消息，UTF-8最多7KB；修改消息提高条目revision，撤下以items为空数组替换
      properties:
        schema: {type: integer, enum: [1]}
        revision: {type: integer, minimum: 1}
        items:
          type: array
          maxItems: 10
          items:
            allOf:
              - $ref: '#/components/schemas/AnnouncementItem'
              - type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
                  minVersionCode: {type: integer, minimum: 1}
                  maxVersionCode: {type: integer, minimum: 1, nullable: true}

    AnnouncementsResponse:
      type: object
      required: [revision, items]
      properties:
        revision:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementItem"

paths:
  /api/channels:
    get:
      tags: [频道与内容]
      summary: 获取云端动态“大视界”频道拓扑
      description: |
        按授权等级与**当次私密开启状态**双重条件返回可见频道。
        未同时满足「有效 B/Y/S 授权」与「携带有效 `X-Private-Session`」时，
        响应中不含 `private` 节点及其二级分类。
      security:
        - BearerAuth: []
        - BearerAuth: []
          PrivateSession: []
        - {}
      responses:
        "200":
          description: 成功返回动态频道拓扑
          content:
            application/json:
              schema:
                type: object
                required: [version, channels]
                properties:
                  version:
                    type: integer
                    example: 20260930
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelItem"

  /api/sources:
    get:
      tags: [频道与内容]
      summary: 获取经云端健康巡检排序后的播放源列表
      description: |
        返回由 Cron 每天 2 次（UTC 04:00 / 16:00）测速并剔除故障节点后的健康抽象源。
        私密频道的源同样需要高级授权与当次会话；`apiBase` 一律为同源代理地址。
      security:
        - BearerAuth: []
        - BearerAuth: []
          PrivateSession: []
        - {}
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: 按频道筛选（drama, movie, anime, documentary, private）
      responses:
        "200":
          description: 成功返回可用播放源
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedAt:
                    type: integer
                    example: 1759238400
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceProvider"

  /api/search/suggestions:
    get:
      tags: [搜索与同步]
      summary: 公开目录输入补全（不调用在线生成模型）
      description: 仅包含当前generation可公开的作品/标签及纠错候选；现代workFacts代从内部publicSearch召回并复核同代事实，缺失或损坏投影/事实返回503，禁止回旧D1。私密及失效内容永不出现。客户端缓存只允许公开建议。中文单字、双字、多音字和拼音召回通过写入侧词元及样本检验，不把 unicode61 当作中文分词。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        '200':
          description: 最多 10 条公开候选；AI 不可用时仍返回词法候选
          content:
            application/json:
              schema:
                type: object
                required: [query, suggestions]
                properties:
                  query:
                    type: string
                  suggestions:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/SearchSuggestion'
        '503':
          description: 当前公开generation的搜索投影或事实缺失/损坏；不得回旧D1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/search:
    get:
      tags: [搜索与同步]
      summary: 公开目录关键词/拼音/模糊词法检索
      description: >-
        本期纯词法搜索；2026-10-06已批准真实来源搜索，ADR-006 Accepted，未部署/验收。
        App完整查询先显本机结果、默认自动联网补充，无论有无命中；不逐键穿透。
        云端真实搜索受控公开来源，保留白名单/逐跳SSRF/限流/超时，响应元数据与错误及日志零品牌，日志无原始URL/响应/上游域名；private/exclude不入公开查询/缓存/索引/日志/持久层。
        查询缓存/同词并发合并包含规范化查询、频道/标签、public边界及来源配置版本，分页不串，跨实例范围待验；只复用新鲜核验结果，过期重验。
        核验公开身份、可信作品映射、完整集数/季数与可用线路后共享持久保存facts/发现索引，不等起播；永久剧库与关键词缓存不同，TTL到期不删作品，新集新季/线路失效/撤片持续更新。
        静态全量基底同代publicSearch/workFacts复核，独立共享发现增量复核版本与当前公开flags，不每搜改整个manifest；缺失或损坏事实503，不回旧公开D1掩盖损坏，D1全文仅真实旧代兼容。
        成功确认无结果才短负缓存不超过5分钟，超时/限流/来源或核验失败不写成功空集；保留本机结果并提示补充失败；pending可返回200等待态，成功partial保留结果，只有已结束失败且无可用结果时返回503，不用200空集冒充确认无结果。
        每请求精确/别名优先，再拼音/首字母，再模糊纠偏，稳定作品ID去重；page尽力分页，客户端跨页去重。
        客户端纵向三列全可达/加载更多，准确已展示/已加载计数与真实标签，未知总数不伪造；hasMore可选且缺省不是false。
        客户端基底与发现按稳定ID/版本原子合并数据和同步进度，重启/整包升级不误删，仅明确撤片/删除事实才移除。
        发现同步使用GET /api/search/discoveries的独立seq游标，不复用catalog revision；D1仅存发现metadata/任务，R2存事实与cursor，使用无r2.dev的独立DISCOVERY_BUCKET。
        当前基线disabled/private裁决不可被发现覆盖；永久剧库metadata与24小时刷新播放事实分离，持久存在不代表永久可播。
        pending时App按retryAfterSeconds自动同词同页轮询直到pending结束，切词取消；成功partial保留已有结果，不能伪装成功empty或确认无结果。
        必要云/CI/独立验收APK获准，官网APK/OTA验收后；本文档同步不证明部署或发布。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: channel
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - name: discoveryPage
          in: query
          description: 可选真实来源发现页；轮询须保持同词同页，不与目录分片页或发现seq混用。
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: 检索结果列表；允许partial/pending，不能据此宣称确认无结果
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  page:
                    type: integer
                  hasMore:
                    type: boolean
                    description: 可选；true表示当前查询及过滤下仍有下一页，false表示已确认无下一页；缺省表示未知，不是false，客户端继续旧分页兼容。不是总数或联网核验成功的证明。
                  discoveryPending:
                    type: boolean
                    description: 发现仍在处理；App自动同词同页轮询直到false，切词取消旧轮询及迟到响应。
                  discoveryFailed:
                    type: boolean
                    description: 发现失败标记；保留已有partial结果并提示失败/重试，不把失败缓存为成功empty。
                  retryAfterSeconds:
                    type: integer
                    description: 下一次同词同页轮询的等待秒数；不是查询缓存或播放事实TTL。
        '429':
          description: 公开搜索独立限流，使用既有RATE_LIMITED错误码，不作为无结果或负缓存。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 当前公开搜索投影/事实缺失或损坏，或真实来源搜索/核验失败且无可用结果；不得回旧D1或以成功空集冒充无结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/search/discoveries:
    get:
      tags: [搜索与同步]
      summary: 共享公开发现增量（独立seq游标）
      description: >-
        after为独立seq cursor，不是catalog revision；返回公开upsert/withdraw，不返回private/exclude元数据或私密墓碑。
        当前基线disabled/private裁决不得被发现覆盖；card为可选公开卡片，不含播放地址或内部R2事实句柄。
        limit 是上界而非承诺：服务端单页硬预算 10 条以守住免费档 CPU 预算，返回条数少于请求值且 hasMore=false 即已到当前游标末尾；
        历史 upsert 若已撤回/过期/被基线接管则降级为 withdraw 返回，游标按 seq 单调推进、绝不跳号。
        D1存metadata，独立DISCOVERY_BUCKET存事实/cursor且无r2.dev；数据与客户端cursor同事务幂等提交，整包不含作品不是删除证明。
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: 按独立seq同步公开发现变更
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, hasMore]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [seq, workId, operation, updatedAt]
                      properties:
                        seq:
                          type: integer
                        workId:
                          type: string
                        operation:
                          type: string
                          enum: [upsert, withdraw]
                        updatedAt:
                          type: integer
                          description: Unix秒
                        card:
                          $ref: '#/components/schemas/ContentItem'
                  cursor:
                    type: integer
                    description: 本页同步进度；下次作为after，不与catalog revision混用。
                  hasMore:
                    type: boolean
  /api/titles/{titleId}/episodes/{episodeNumber}/native-playback:
    get:
      tags: [内容]
      summary: 按权威清单复核原生播放线路
      description: 复用作品详情准入，每次读取服务端权威作品清单；仅接受line参数，不接受videoId或额外参数。只返回非密钥身份，响应no-store。本接口不是签名凭据；原生强制调用尚待接入。
      parameters:
        - name: titleId
          in: path
          required: true
          schema: {type: string}
        - name: episodeNumber
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9999999}
        - name: line
          in: query
          required: true
          schema: {type: integer, minimum: 0, maximum: 9999}
      responses:
        '200':
          description: 已准入权威线路的非密钥身份
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [workId, episodeNumber, lineIndex, native, checkedAt]
                properties:
                  workId: {type: string}
                  episodeNumber: {type: integer}
                  lineIndex: {type: integer}
                  checkedAt: {type: integer}
                  native:
                    type: object
                    additionalProperties: false
                    required: [kind, videoId]
                    properties:
                      kind: {type: string, enum: [s1-cenc]}
                      videoId: {type: string, pattern: '^[0-9]{1,32}$'}
        '404':
          description: 未知、未准入、线路不匹配或参数非法，同构错误响应
        '503':
          description: 权威清单配置或事实不可用
  /api/titles/{titleId}/related:
    get:
      tags: [搜索与同步]
      summary: 同类公开作品推荐
      description: 现代workFacts代使用内部publicSearch同代分类/标签候选，并复核源剧和候选事实；缺失或损坏投影/事实返回503，不回旧D1。私密及撤片不召回，仅真实无workFacts旧代兼容。
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 基于同题材与分类标签的关联作品推荐列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentItem'
        '404':
          description: 未知、下架或未获准的作品
        '503':
          description: 当前公开generation的搜索投影或事实缺失/损坏；不得回旧D1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/changes:
    get:
      tags: [搜索与同步]
      summary: 四公开频道的版本化增量目录（永不返回个人探索）
      description: |
        客户端先取完整公开快照，再顺序应用变更。发布/撤片及日志必须原子提交；客户端每页增量与游标同事务写入，中断重读同一游标幂等重放；游标过期返回 410 重拉快照。
        返回窗口内按 revision 升序，可存在数字空洞（如失败的写入）；不可将“无连续数字”误判为缺页。
        服务端不得在此返回私密内容或私密墓碑。
      parameters:
        - name: after
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 一页已提交的变更，revision 严格递增但不要求整数连续
          content:
            application/json:
              schema:
                type: object
                required: [changes, nextRevision, hasMore]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogChange'
                  nextRevision:
                    type: integer
                    format: int64
                    description: 当前页最后一条变更 revision；空页等于 after。客户端用此值继续请求，不按数字加 1
                  hasMore:
                    type: boolean
        '410':
          description: 游标早于变更日志保留窗口，请重新获取公开目录快照
        '400':
          description: 游标大于当前修订号或参数无效，不得伪装成正常空页
  /api/catalog:
    get:
      tags: [频道与内容]
      summary: 分页获取剧目卡片列表
      description: |
        首页与频道页数据来源。私密频道的条目仅在同时具备高级授权与当次会话时返回；
        请求私密分类但未同时满足有效 B/Y/S 授权与当次会话时，返回不含私密元数据的 404；公开频道可缓存，私密响应不得落持久缓存。
      security:
        - BearerAuth: []
        - BearerAuth: []
          PrivateSession: []
        - {}
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
            enum: [drama, movie, anime, documentary, private]
          example: drama
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: 逆袭
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
          description: 新公开facts generation按60条分片消费；私密及真实旧代兼容另验，不改变搜索分页。
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 首页面返回全局公开修订号；后续页必须携带该修订号，不一致返回 409 并重拉快照。D1 不提供跨请求历史快照；客户端仅提交完整同修订分页。
      responses:
        "200":
          description: 成功返回剧目列表
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total, revision]
                properties:
                  revision:
                    type: integer
                    format: int64
                    description: 当前公开快照的全局修订号，增量同步从此值开始
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContentItem"
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 137
        "409":
          description: 请求分页时公开目录修订号已变化，客户端须重新拉公开快照
        "404":
          description: 请求未获当次准入的私密频道时表现为不存在，响应不含内容元数据

  /api/titles/{titleId}:
    get:
      tags: [频道与内容]
      summary: 剧目详情与分集清单
      description: |
        未同时满足「有效 B/Y/S 授权」与「有效 X-Private-Session」的私密剧目，以及不存在或未上架的剧目，一律返回 404，不区分差异以防探测；
        公开剧目或已获双重准入的私密剧目正常返回 200 及完整剧集清单（TitleAssetResponse，含向后兼容的 item 投影）。
        新公开数据源为当前manifest generation的workFacts按作投影，必须与目录、搜索、分享、海报同代；完整保留集数与线路，不截取两集。有workFacts时缺失或损坏不得回读旧公开D1/稳定title；无workFacts的真实旧代才使用旧资产兼容。公开清单须随generation重验证，私密原双准入路径恒no-store。本轮仅契约修订，R26行为待验。
      security:
        - BearerAuth: []
        - BearerAuth: []
          PrivateSession: []
        - {}
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功返回剧目详情与剧集清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleAssetResponse"
        "404":
          description: 剧目不存在、已下架，或属于未获当次授权的私密内容

  /api/episodes/{episodeId}/playback:
    get:
      tags: [频道与内容]
      summary: 解析分集可播地址
      description: |
        由服务端从有效候选中选一个同源短时代理地址；源失败时客户端以同一 episodeId 最多重取 2 次，并尝试恢复播放进度；候选穷尽返回 503，不无限重试。
        私密未开启或分集不存在一律返回不含元信息的 404，且**绝不**返回真实上游媒体地址。
      security:
        - BearerAuth: []
        - BearerAuth: []
          PrivateSession: []
        - {}
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功返回播放解析结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "404":
          description: 分集不存在、所属剧目不可播或私密未获当次授权；不泄露差异
        "503":
          description: 分集存在且准入有效，但当前无可用来源；不得泄露上游地址

  /api/private-sessions:
    post:
      tags: [私密探索]
      summary: 申请当次私密探索授权
      description: |
        仅在请求者持有有效 B/Y/S 授权且 `acknowledged = true` 时签发短时凭据。
        **客户端凭据与开启状态均不落盘**：只驻本次进程内存，冷启动/完全退出即失效；服务端只可留不可逆摘要撤销墓碑。
        **诚实边界**：服务端只能证明“收到了一次显式开启请求”，无法验证用户是否真的在设备上完成点击；
        客户端若被完全控制，无法阻止其自行发起该请求。此局限须写入交付说明，不得宣称绝对不可绕过。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateSessionRequest"
      responses:
        "201":
          description: 成功签发当次私密会话凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateSessionResponse"
        "400":
          description: 未确认免责提示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 授权档位不足（非 B/Y/S 或已过期）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [私密探索]
      summary: 主动结束当次私密探索
      description: 客户端关闭开关时调用；服务端仅持久化 token 摘要撤销墓碑（不含开启状态/内容 ID），直到原凭据过期；每次后续私密请求查撤销记录。
      security:
        - BearerAuth: []
          PrivateSession: []
      responses:
        "204":
          description: 已结束

  /api/config/monetization:
    get:
      tags: [商业化]
      summary: 获取云端动态商业策略与软提醒配置
      description: |
        动态下发当前展示的档位、价格、试用阈值与文案，客户端零硬编码。
        初期仅公开 Q 档季卡 ¥9.9 / 90 天；B/Y 暂隐展示但权限保留。
      responses:
        "200":
          description: 成功返回动态商业与提醒配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonetizationConfig"

  /api/redeem:
    post:
      tags: [商业化]
      summary: 预制卡密条件原子核销与设备绑定
      description: |
        绑定规则（唯一口径；仅支持本期 Android 客户端）：
        1. 同一 `deviceId` 重复提交同一卡密且当前卡密/设备仍有效 → 幂等返回当前授权，`device_count` 不重复累加；撤销/到期不返回旧成功凭证；
        2. 新设备 → 仅当 `device_count < max_devices`（默认 10）时成功；第 11 台起拒绝；
        3. 被拒绝的**不同**设备记入去重流水，累计 > 20 时置 `is_abnormal = 1`；
        4. 条件更新同时约束 status 为 UNUSED/ACTIVE，绑定流水与设备写入同一原子单元；跨请求并发须用真实 D1 证明第 10/11 台结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: 核销成功（含幂等复用场景）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemSuccessResponse"
        "400":
          description: 卡密无效、已吊销、格式错误或设备绑定数超限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 单 IP 兑换尝试过于频繁（口径：1 分钟超过 10 次）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/device/ping:
    get:
      tags: [系统]
      summary: 校验授权状态并续期
      description: 设备重新联网后验证撤销/过期状态并签发新的 Ed25519 JWT；失效凭证返回 401，不得在仅靠离线公钥验证的情况下自发续期。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功返回当前授权状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePingResponse"
        "401":
          description: 凭证无效或已过期，需要重新核销

  /api/user/sync:
    get:
      tags: [系统]
      summary: 拉取云端多端同步状态（观看断点与偏好画像）
      description: |
        以卡密为身份锚点返回该家庭共享域下的最近观看断点与题材偏好画像，供电视 / PC / 新手机首次打开时继承。
        未核销卡密的设备同样返回 200，但 history 为空、preferences 为 null —— 保持与已同步成员同形，
        避免状态码本身成为"是否为付费成员"的判别通道。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功返回同步状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncStateResponse"
        "401":
          description: 凭证无效或已过期
        "429":
          description: 同步请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [系统]
      summary: 上报观看断点与偏好画像
      description: |
        客户端在退出播放页与程序挂起两个离场时点上报。个人探索（is_private = 1）内容物理禁止同步：
        服务端在写入前即拒绝，且"内容不存在"与"存在但私密"返回字节完全一致的响应，
        杜绝通过外键异常差异探测私密作品存在性（AC-02-3）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncRequest"
      responses:
        "200":
          description: 已接受；无论是否实际写入均返回同形成功响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncAcceptedResponse"
        "400":
          description: 同步载荷格式不正确
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 凭证无效或已过期
        "429":
          description: 同步请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/version:
    get:
      tags: [系统]
      summary: OTA 在线版本检测公告牌
      responses:
        "200":
          description: 成功返回各平台最新版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/announcements:
    get:
      tags: [系统]
      summary: 获取应用内最新有效公告列表
      parameters:
        - name: versionCode
          in: query
          required: false
          schema:
            type: integer
          description: 客户端当前版本码
      responses:
        "200":
          description: 成功返回有效公告列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementsResponse"
        "400":
          description: 参数格式无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/telemetry/lines:
    post:
      tags: [系统]
      summary: 线路健康信号批量上报（分布式感知，集中式决策）
      description: |
        免鉴权；客户端在离场节点批量静默上报播放失败信号（SPEC-CLOUD-REFACTOR v2 §C-4）。
        单请求最多 20 条，超出静默截断；信号只含抽象 provider 代号与集号，严禁上游域名或剧目元信息。
        失败即弃：客户端不重试、不入盘。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 20
              items:
                type: object
                required: [providerId, workId, lineIndex, failureCode, deviceHash]
                properties:
                  providerId:
                    type: string
                    example: provider_m1
                  workId:
                    type: string
                    example: d_8f31c2
                  lineIndex:
                    type: integer
                    minimum: 0
                  failureCode:
                    type: string
                    enum: [timeout, http_error, decode_error]
                  deviceHash:
                    type: string
                    description: 设备指纹单向哈希，仅用于去重，不可反推设备
                  reportedAt:
                    type: integer
      responses:
        "200":
          description: 已接收（accepted 为实际落库条数）
          content:
            application/json:
              schema:
                type: object
                required: [success, accepted]
                properties:
                  success:
                    type: boolean
                  accepted:
                    type: integer
        "400":
          description: 请求体不符合契约（VALIDATION_ERROR）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /s/{drama_id}:
    get:
      tags: [分享与下载]
      summary: 极简分享落地页（当前单集、播完截流）
      description: |
        无论来源 UA 为何，一律直接渲染当前单集播放页，不做微信跳出引导。
        自动播放仅作“尝试”，被浏览器策略拒绝时必须提供单次点击播放兜底。
        【安全铁律】私密剧目与未知剧目一律 404，且响应体不得泄露任何剧目元信息。
      parameters:
        - name: drama_id
          in: path
          required: true
          schema:
            type: string
        - name: ep
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: ref
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 返回极简原生 HTML5 单集播放页面（零外部网络与脚本依赖，极速秒开）；当前集 `ended` 时展示下载引导卡
          content:
            text/html:
              schema:
                type: string
        "404":
          description: 剧目不存在、已下架，或属于禁止分享的私密内容

  /dl:
    get:
      tags: [分享与下载]
      summary: 软件下载引导页（微信环境指引 + Android 下载）
      description: |
        1. UA 含 `MicroMessenger` → 返回合规引导页，提示“点击右上角在浏览器中打开”；
        2. Android 浏览器 → 引导至 `/dl/latest/android`；
        3. Windows 浏览器 → 仅说明本期提供 Android 版本，不展示或跳转到不存在的 PC 安装包。
        下载引导只在此路由承担，`/s` 不承担该职责。
      parameters:
        - name: ref
          in: query
          required: false
          schema:
            type: string
          description: 邀请提示参数；浏览器下载 APK 后不会天然传入 App，不能凭此参数自动结算奖励
      responses:
        "200":
          description: 微信环境下的合规操作指引或 Android 下载卡片 HTML；不承诺绕过平台限制
          content:
            text/html:
              schema:
                type: string

  /dl/latest/{platform}:
    get:
      tags: [分享与下载]
      summary: 已核验 Android 安装包同域下载入口
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [android]
      responses:
        "302":
          description: android读取版本artifact并核对R2元数据后302至同域/dl/artifacts/{versionCode}/{sha256}.apk，no-store
        "404":
          description: 未支持的平台
        "503":
          description: 版本、对象或元数据尚未核验一致

  /dl/artifacts/{versionCode}/{file}:
    parameters:
      - name: versionCode
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - name: file
        in: path
        required: true
        schema: {type: string, pattern: '^[a-f0-9]{64}\.apk$'}
    get:
      tags: [分享与下载]
      summary: 不可变APK完整流式下载
      description: Accept-Ranges:none，Range/If-Range忽略并完整200；本批不支持续传，无外域跳转
      responses:
        '200':
          description: 与对象大小一致的完整APK字节，公开不可变缓存
          content:
            application/vnd.android.package-archive:
              schema: {type: string, format: binary}
        '404': {description: 非法路径或对象不存在}
        '503': {description: 存储不可用}
    head:
      tags: [分享与下载]
      summary: APK大小与类型，无响应体
      responses:
        '200': {description: Content-Length为完整对象大小，无body}
        '404': {description: 非法路径或对象不存在}
        '503': {description: 存储不可用}

  /:
    get:
      tags: [分享与下载]
      summary: 官方门户（产品介绍与 APK 下载）
      description: 服务端渲染的极简静态 HTML（SPEC-STATIC-PAGES v2 §S-4），零站点脚本、零上游域名；吸收设备矩阵信息密度，日夜双模。
      responses:
        "200":
          description: 官方门户页
          content:
            text/html:
              schema:
                type: string

  /assets/{file}:
    get:
      tags: [分享与下载]
      summary: 自托管播放器组件（分享页唯一站点级 JS 资产）
      description: |
        当前唯一合法成员为 hls.min.js（含内容哈希变体），源自 npm hls.js 构建产物、由 CI 上传 R2；
        immutable 长缓存。禁止第三方 CDN（微信内可达性），禁止任意文件枚举——非白名单名一律 404。
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: hls.min.js
      responses:
        "200":
          description: JavaScript 资产
          content:
            application/javascript:
              schema:
                type: string
        "404":
          description: 非白名单资产名

  /robots.txt:
    get:
      tags: [SEO与爬虫]
      summary: 搜索引擎爬虫协议
      description: 规范搜索引擎网络爬虫抓取范围与站点地图索引
      responses:
        "200":
          description: robots.txt 文本
          content:
            text/plain:
              schema:
                type: string

  /sitemap.xml:
    get:
      tags: [SEO与爬虫]
      summary: XML 站点地图
      description: 供搜索引擎抓取的主站公开页面与下载指引 URL 索引
      responses:
        "200":
          description: sitemap.xml 格式
          content:
            application/xml:
              schema:
                type: string

  /proxy/{kind}/{handle}:
    get:
      tags: [系统]
      summary: 同源受控媒体与图片代理 (多段合规路由)
      description: |
        客户端唯一可访问的媒体入口。仅放行白名单内的目标，禁止任意 URL 转发（防 SSRF）。
        对每次请求（含 HLS 清单、分片、封面和 Range）校验短时签名对应的内容 ID、公开/私密类别、当前 D1 发布状态；私密请求必须与当前 B/Y/S 授权和未结束的 X-Private-Session 绑定，禁止仅凭可复制的 URL 访问。
        私密响应 Cache-Control: no-store，公开海报可用 ETag/版本指纹缓存；不得把私密元信息写入边缘公共缓存。真实上游地址只在服务端使用，永不下发。原生 HLS 子请求未必携带自定义 X-Private-Session，私密播放需同进程受控请求转发逐次注入 Bearer 与会话；如改用可撤销等效凭据，须先另行更新此机读契约并真机验证，当前不能直接放开私密取流。
        HLS 清单中的相对/绝对分片、密钥 URI 和字幕引用必须重写为同源受控 URL；每个子请求保留内容身份并复核权限，Range/206、Content-Type 与跨域策略需使用真实授权 HLS 样本验证。
      security:
        - BearerAuth: []
          PrivateSession: []
        - BearerAuth: []
        - {}
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [img, media]
          description: "代理资源类别（img: 缩略海报，media: HLS 流与媒体分片）"
        - name: handle
          in: path
          required: true
          schema:
            type: string
          description: "不透明资源标识符（如 content_id 或短时流 token）"
        - name: exp
          in: query
          required: false
          schema:
            type: integer
          description: 代理地址过期时间戳，作为短时签名声明的一部分；不得单凭 exp 放行
        - name: sig
          in: query
          required: false
          schema:
            type: string
          description: 服务端下发的防篡改签名（针对媒体分片与短时代理 URL）
      responses:
        "200":
          description: 清单、完整媒体或图片内容；私密响应 no-store
        "206":
          description: 有效 Range 分片，返回 Content-Range 与 Accept-Ranges；逐次复核准入
        "403":
          description: 公开内容的代理签名失效或请求目标不在白名单（不得泄露上游位置）
        "404":
          description: 目标不存在、已撤片，或私密内容未获当次双重授权；响应体不区分原因

