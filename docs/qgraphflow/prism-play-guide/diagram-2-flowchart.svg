il" class="node-drawing"><title>提示打开失败</title><g class="shape-label"><rect x="963" y="1346" width="240" height="100" rx="50" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="1083" y="1403.5" class="shape-title" text-anchor="middle">提示打开失败</text></g></g><g data-diagram-node-id="pick" class="node-drawing"><title>选择本次要看的集数</title><g class="shape-label"><rect x="632" y="1346" width="267" height="100" rx="10" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="765.5" y="1403.5" class="shape-title" text-anchor="middle">选择本次要看的集数</text></g></g><g data-diagram-node-id="lines" class="node-drawing"><title>取得本集播放线路</title><g class="shape-label"><rect x="643.5" y="1636" width="244" height="100" rx="10" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><path d="M 654.5 1636V 1736M 876.5 1636V 1736" stroke="#16816d"/><text x="765.5" y="1693.5" class="shape-title" text-anchor="middle">取得本集播放线路</text></g></g><g data-diagram-node-id="available" class="node-drawing"><title>取得可用地址？</title><g class="shape-label"><polygon points="765.5,1926 885.5,1993 765.5,2060 645.5,1993" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="765.5" y="1986" class="shape-title" text-anchor="middle">取得可用地</text><text x="765.5" y="2015" class="shape-title" text-anchor="middle">址？</text></g></g><g data-diagram-node-id="load" class="node-drawing"><title>加载视频并尝试起播</title><g class="shape-label"><rect x="464" y="2250" width="267" height="100" rx="10" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="597.5" y="2307.5" class="shape-title" text-anchor="middle">加载视频并尝试起播</text></g></g><g data-diagram-node-id="ready" class="node-drawing"><title>媒体加载是否正常？</title><g class="shape-label"><polygon points="597.5,2540 731,2607 597.5,2674 464,2607" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="597.5" y="2600" class="shape-title" text-anchor="middle">媒体加载是否</text><text x="597.5" y="2629" class="shape-title" text-anchor="middle">正常？</text></g></g><g data-diagram-node-id="watch" class="node-drawing"><title>进入观看，必要时点击播放</title><g class="shape-label"><rect x="644.5" y="2864" width="336" height="100" rx="50" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="812.5" y="2907" class="shape-title" text-anchor="middle">进入观看，必要时点击播</text><text x="812.5" y="2936" class="shape-title" text-anchor="middle">放</text></g></g><g data-diagram-node-id="retry" class="node-drawing"><title>还能自动换下一条线路？</title><g class="shape-label"><polygon points="440,2864 596.5,2931 440,2998 283.5,2931" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="440" y="2924" class="shape-title" text-anchor="middle">还能自动换下一</text><text x="440" y="2953" class="shape-title" text-anchor="middle">条线路？</text></g></g><g data-diagram-node-id="switch" class="node-drawing"><title>换线并保留观看位置</title><g class="shape-label"><rect x="126" y="3188" width="267" height="100" rx="10" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="259.5" y="3245.5" class="shape-title" text-anchor="middle">换线并保留观看位置</text></g></g><g data-diagram-node-id="stop" class="node-drawing"><title>提示不可用或提供重试入口</title><g class="shape-label"><rect x="476.5" y="3188" width="336" height="100" rx="50" class="node-surface" fill="#e7f1f0" stroke="#16816d" stroke-width="1.2"/><text x="644.5" y="3231" class="shape-title" text-anchor="middle">提示不可用或提供重试入</text><text x="644.5" y="3260" class="shape-title" text-anchor="middle">口</text></g></g></svg>
