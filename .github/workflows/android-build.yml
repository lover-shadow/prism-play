name: Android APK Build & Artifact Packaging

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK on Cloud CI
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 设置 JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 构建缓存与加速
        uses: gradle/actions/setup-gradle@v4

      - name: 接受 Android SDK 协议许可
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses 2>/dev/null || true


      - name: 安装项目依赖
        run: |
          npm ci

      - name: 运行契约与数据模型静态复核
        run: |
          python tests/verify_contracts.py

      - name: 运行 Android 原生资产与组件声明复核
        run: |
          python tests/verify_android_assets.py

      - name: 运行 30 项验收标准矩阵覆盖复核 (AC-01~30)
        run: |
          python tests/verify_acceptance.py

      - name: 运行 P0 工程红线扫描
        run: |
          python tests/scan_p0.py

      - name: 运行全量单元与集成测试
        run: |
          npm test
          node --test tests/edge/*.test.mjs

      - name: 执行前端生产构建 (tsc + Vite)
        run: |
          npm run build

      - name: 组织 Android 原生工程与 Capacitor 同步
        run: |
          # 1. 备份手写原生源码与配置
          cp -r android android.handauthored
          # 2. 如果不存在 gradlew 引导脚手架，调用 cap add 生成基础工程结构
          if [ ! -f "android/gradlew" ]; then
            npx cap add android || true
          fi
          # 3. 将手写原生源码反向覆盖回填，确保手写逻辑绝对优先
          cp -rf android.handauthored/* android/
          rm -rf android.handauthored
          # 4. 执行 Capacitor 资源同步
          npx cap sync android

      - name: 编译构建 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 归档上传 APK 构建产物至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-play-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 发布最新 APK 至 R2 存储桶供官网下载
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          APK_FILE=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -f "$APK_FILE" ]; then
            npx wrangler r2 object put prism-play-releases/releases/android/latest.apk \
              --file="$APK_FILE" \
              --content-type=application/vnd.android.package-archive --remote
            echo "最新 APK 已成功发布至 R2 /dl/latest/android"
          fi
